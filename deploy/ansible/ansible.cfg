[defaults]
inventory = inventory/hosts
host_key_checking=False
forks=20
home=$VIRTUAL_ENV/.ansible
remote_user = debian
# vault_password_file = .vault_pass
collections_path = $VIRTUAL_ENV/.ansible/collections
allow_broken_conditionals = True
interpreter_python = auto_silent
# inject_facts_as_vars = False


[privilege_escalation]
become = yes

[ssh_connection]
pipelining = True
ssh_args= -o AddressFamily=inet -o PasswordAuthentication=no -o PreferredAuthentications=publickey -o ConnectTimeout=60s -o ControlMaster=auto -o ControlPersist=60s
